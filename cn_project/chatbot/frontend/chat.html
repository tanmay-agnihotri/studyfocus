<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StudyFocus AI Tutor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #fff4e0 0%, #ffe0ec 50%, #f0e0ff 100%);
    min-height: 100vh;
    padding: 24px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 16px; }
  .header h1 {
    font-size: 26px; font-weight: 800;
    background: linear-gradient(90deg, #ff6ec7, #a855f7);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .header .sub { color: #7a5a94; font-size: 13px; margin-top: 4px; }
  .header .back-link { display: inline-block; margin-top: 8px; color: #a855f7; font-size: 12px; text-decoration: none; }

  .chat-card {
    background: #fff; border-radius: 20px; box-shadow: 0 10px 40px rgba(168,85,247,0.15);
    overflow: hidden; display: flex; flex-direction: column; height: 65vh;
  }
  .messages { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { margin-bottom: 14px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 78%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .msg.user .bubble { background: linear-gradient(90deg, #ff6ec7, #a855f7); color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: #faf5ff; color: #2a2140; border-bottom-left-radius: 4px; }
  .msg.system .bubble { background: #fff4e0; color: #8a6a2a; font-size: 12px; text-align: center; margin: 0 auto; }

  .links-block { margin-top: 8px; padding: 10px 14px; background: #f0fdf4; border-radius: 12px; border: 1px solid #bbf7d0; }
  .links-block .links-title { font-size: 11px; color: #16a34a; font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
  .links-block a { display: block; font-size: 12px; color: #15803d; margin-bottom: 3px; text-decoration: none; }
  .links-block a:hover { text-decoration: underline; }

  .typing-indicator { display: none; color: #a855f7; font-size: 12px; padding: 0 20px 10px; }
  .typing-indicator.show { display: block; }

  .input-row { display: flex; gap: 8px; padding: 14px 16px; border-top: 1px solid #f0e8fa; background: #fff; }
  .input-row input {
    flex: 1; padding: 12px 16px; border-radius: 12px; border: 1.5px solid #f0d8fa;
    background: #fffaf0; font-size: 14px; color: #2a2140;
  }
  .input-row input:focus { outline: none; border-color: #ff6ec7; }
  .input-row button {
    padding: 12px 20px; border-radius: 12px; border: none;
    background: linear-gradient(90deg, #ff6ec7, #a855f7); color: #fff; font-weight: 700; cursor: pointer;
  }
  .input-row button:disabled { opacity: 0.5; cursor: not-allowed; }

  .notes-bar { display: flex; gap: 8px; margin-top: 12px; align-items: center; justify-content: center; }
  .notes-bar label {
    padding: 8px 14px; border-radius: 999px; background: #fff; border: 1px solid #f0d8fa;
    color: #a855f7; font-size: 12px; cursor: pointer; font-weight: 600;
  }
  .notes-bar input[type="file"] { display: none; }
  .notes-status { font-size: 11px; color: #7a5a94; }

  .status-banner {
    background: #fff4e0; border: 1px solid #ffd88f; border-radius: 12px;
    padding: 10px 16px; font-size: 12px; color: #8a6a2a; margin-bottom: 12px; text-align: center;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <h1>StudyFocus AI Tutor</h1>
    <p class="sub">Ask me anything about what you're studying</p>
    <a class="back-link" href="../dashboard/dashboard.html">&larr; Back to dashboard</a>
  </div>

  <div class="status-banner" id="status-banner" style="display:none"></div>

  <div class="chat-card">
    <div class="messages" id="messages"></div>
    <div class="typing-indicator" id="typing">Tutor is typing...</div>
    <div class="input-row">
      <input type="text" id="chat-input" placeholder="What are you studying today?" onkeydown="if(event.key==='Enter')sendMessage()">
      <button onclick="sendMessage()" id="send-btn">Send</button>
    </div>
  </div>

  <div class="notes-bar">
    <label>Upload notes (PDF or text)
      <input type="file" id="notes-file" accept=".pdf,.txt" onchange="uploadNotes()">
    </label>
    <span class="notes-status" id="notes-status"></span>
  </div>
</div>

<script>
const API_BASE = "http://127.0.0.1:8000";
const STUDENT_ID = localStorage.getItem("studyfocus_student_id") || (function() {
  const id = "student_" + Date.now();
  localStorage.setItem("studyfocus_student_id", id);
  return id;
})();

let history = [];

function addMessage(role, text, links) {
  const messages = document.getElementById("messages");
  const msgDiv = document.createElement("div");
  msgDiv.className = "msg " + role;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  msgDiv.appendChild(bubble);
  messages.appendChild(msgDiv);

  if (links && links.length > 0) {
    const linksBlock = document.createElement("div");
    linksBlock.className = "links-block";
    let html = '<div class="links-title">Helpful resources</div>';
    links.forEach(function(item) {
      html += '<a href="' + item.links.explanation + '" target="_blank">' + item.topic + ' - explanation</a>';
      html += '<a href="' + item.links.youtube_search + '" target="_blank">' + item.topic + ' - video tutorial</a>';
      html += '<a href="' + item.links.practice + '" target="_blank">' + item.topic + ' - practice</a>';
    });
    linksBlock.innerHTML = html;
    messages.appendChild(linksBlock);
  }

  messages.scrollTop = messages.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById("chat-input");
  const text = input.value.trim();
  if (!text) return;

  addMessage("user", text);
  input.value = "";
  document.getElementById("send-btn").disabled = true;
  document.getElementById("typing").classList.add("show");

  try {
    const res = await fetch(API_BASE + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        student_id: STUDENT_ID,
        message: text,
        history: history,
      }),
    });
    const data = await res.json();

    history.push({ role: "user", content: text });
    history.push({ role: "assistant", content: data.reply });

    addMessage("assistant", data.reply, data.suggested_links);
  } catch (e) {
    addMessage("system", "Could not reach the tutor backend. Is it running on port 8000?");
  } finally {
    document.getElementById("send-btn").disabled = false;
    document.getElementById("typing").classList.remove("show");
  }
}

async function uploadNotes() {
  const fileInput = document.getElementById("notes-file");
  const file = fileInput.files[0];
  if (!file) return;

  const statusEl = document.getElementById("notes-status");
  statusEl.textContent = "Uploading...";

  const formData = new FormData();
  formData.append("student_id", STUDENT_ID);
  formData.append("file", file);

  try {
    const res = await fetch(API_BASE + "/upload-notes", { method: "POST", body: formData });
    const data = await res.json();
    statusEl.textContent = "\u2713 " + data.filename + " added (" + data.chunks_stored + " sections)";
    addMessage("system", "Notes from \"" + data.filename + "\" have been added - I'll use them when relevant to your questions.");
  } catch (e) {
    statusEl.textContent = "Upload failed - is the backend running?";
  }
}

async function checkBackendStatus() {
  const banner = document.getElementById("status-banner");
  try {
    const res = await fetch(API_BASE + "/health");
    const data = await res.json();
    if (!data.gemini_configured) {
      banner.style.display = "block";
      banner.textContent = "Tutor backend is running, but no API key is set yet - add your GEMINI_API_KEY to .env";
    } else {
      banner.style.display = "none";
    }
  } catch (e) {
    banner.style.display = "block";
    banner.textContent = "Tutor backend not reachable - run: uvicorn main:app --reload --port 8000";
  }
}

addMessage("assistant", "Hi! I'm your study tutor. Tell me what you're working on, and I'll help you understand it step by step - not just hand you the answer, but actually help it click.");
checkBackendStatus();
</script>

</body>
</html>
